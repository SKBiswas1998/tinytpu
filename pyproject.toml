[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytpu"
version = "0.1.0"
description = "Production edge AI framework for robots on Raspberry Pi. From silicon to safety-certified control."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "SK Biswas", email = "skbiswas1998@gmail.com"},
]
keywords = [
    "edge-ai", "raspberry-pi", "robotics", "tpu", "inference",
    "onnx", "yolo", "object-detection", "kalman-filter",
    "hailo", "coral", "quantization", "systolic-array",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]

dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
inference = ["onnx>=1.14", "onnxruntime>=1.16", "pillow>=9.0"]
vision = ["opencv-python-headless>=4.8", "pillow>=9.0"]
robotics = ["opencv-python-headless>=4.8", "pillow>=9.0", "onnx>=1.14", "onnxruntime>=1.16"]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23", "websockets>=11.0"]
llm = ["requests>=2.28"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
all = ["tinytpu[inference,vision,robotics,dashboard,llm,dev]"]

[project.urls]
Homepage = "https://github.com/SKBiswas1998/tinytpu"
Documentation = "https://github.com/SKBiswas1998/tinytpu#readme"
Repository = "https://github.com/SKBiswas1998/tinytpu"
Issues = "https://github.com/SKBiswas1998/tinytpu/issues"

[project.scripts]
tinytpu = "tinytpu.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinytpu = ["py.typed", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
