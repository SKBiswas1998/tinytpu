[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytpu"
version = "0.1.0"
description = "Open-source TPU for memory-efficient LLM inference"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.20.0", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black", "mypy"]

[tool.setuptools.packages.find]
where = ["software"]
