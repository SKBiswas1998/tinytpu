[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytpu"
version = "0.2.0"
description = "Minimal TPU implementation for learning and LLM inference"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SKBiswas1998"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
fast = ["torch>=2.0"]
llm = ["torch>=2.0", "transformers>=4.30"]
dev = ["pytest", "torch", "transformers"]
all = ["torch>=2.0", "transformers>=4.30", "pytest"]

[project.urls]
Homepage = "https://github.com/SKBiswas1998/tinytpu"
Repository = "https://github.com/SKBiswas1998/tinytpu"

[tool.setuptools.packages.find]
where = ["software"]
